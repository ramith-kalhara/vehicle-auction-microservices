spring.application.name=api-gateway
server.port=9000

# Route: User Service
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/**
spring.cloud.gateway.routes[0].filters[0]=RewritePath=/api/v1/(?<remaining>.*), /${remaining}

# Route: Vehicle Service
spring.cloud.gateway.routes[1].id=vehicle-service
spring.cloud.gateway.routes[1].uri=http://localhost:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/vehicles/**
spring.cloud.gateway.routes[1].filters[0]=RewritePath=/api/vehicles/(?<remaining>.*), /${remaining}

# Route: Auction Service
spring.cloud.gateway.routes[2].id=auction-service
spring.cloud.gateway.routes[2].uri=http://localhost:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/auctions/**
spring.cloud.gateway.routes[2].filters[0]=RewritePath=/api/auctions/(?<remaining>.*), /${remaining}

# Route: Bidding Service
spring.cloud.gateway.routes[3].id=bidding-service
spring.cloud.gateway.routes[3].uri=http://localhost:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/bids/**
spring.cloud.gateway.routes[3].filters[0]=RewritePath=/api/bids/(?<remaining>.*), /${remaining}

# Route: Payment Service
spring.cloud.gateway.routes[4].id=payment-service
spring.cloud.gateway.routes[4].uri=http://localhost:8085
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/payments/**
spring.cloud.gateway.routes[4].filters[0]=RewritePath=/api/payments/(?<remaining>.*), /${remaining}

# Route: Notification Service
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=http://localhost:8086
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/notification/**
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/notifications/(?<remaining>.*), /${remaining}

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
# This makes Swagger UI available at /swagger-ui/index.html
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.display-query-params=true

# Aggregate microservice swagger docs
# Ensure these match the RewritePath filters below
springdoc.swagger-ui.urls[0].name=User Service
springdoc.swagger-ui.urls[0].url=/api/v1/v3/api-docs

springdoc.swagger-ui.urls[1].name=Vehicle Service
springdoc.swagger-ui.urls[1].url=/api/vehicles/v3/api-docs
springdoc.swagger-ui.urls[2].name=Auction Service
springdoc.swagger-ui.urls[2].url=/api/auctions/v3/api-docs
springdoc.swagger-ui.urls[3].name=Bidding Service
springdoc.swagger-ui.urls[3].url=/api/bids/v3/api-docs
springdoc.swagger-ui.urls[4].name=Payment Service
springdoc.swagger-ui.urls[4].url=/api/payments/v3/api-docs
springdoc.swagger-ui.urls[5].name=Notification Service
springdoc.swagger-ui.urls[5].url=/api/notifications/v3/api-docs

